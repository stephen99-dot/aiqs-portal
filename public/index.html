<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>AI QS — Customer Portal</title>
  <meta name="description" content="Upload drawings, track orders, and download your professional BOQs." />
  <link rel="icon" href="/favicon.ico" />
  <link rel="apple-touch-icon" href="/logo192.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Instrument+Sans:ital,wght@0,400..700;1,400..700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body { margin: 0; overflow-x: hidden; }
    input, select, textarea { font-size: 16px !important; }
    @media (max-width: 768px) {
      input, select, textarea, button { font-size: 16px !important; }
    }
  </style>
</head>
<body>
  <div id="root"></div>
<!-- ═══════════════════════════════════════════════════════════════════════
  AI Trades Pilot promo — "watch it work" animated demo embed.
  Every account, every visit: a corner card with a live-animating
  mini demo; clicking it (or "Watch the full demo") opens a cinematic
  modal where the product prices a job, writes the paperwork and catches
  an overspend — then the trial / demo-booking buttons.
════════════════════════════════════════════════════════════════════════ -->
<script>
(function () {
  if (window.__atpPromo) return; window.__atpPromo = true;

  var TRIAL_URL = 'https://app.aitradespilot.com/register';
  var DEMO_URL  = 'https://calendly.com/hello-crmwizardai/30min';

  /* ── styles ─────────────────────────────────────────────────────────── */
  var css = ''
  + ':root{--atpB:#0071F3;--atpBD:#0059CE;--atpNavy:#0B1730;--atpNavy2:#0E1B33;--atpLine:rgba(127,178,255,.22)}'
  + '#atpCard{position:fixed;bottom:20px;right:20px;z-index:2147483000;width:330px;'
  + 'background:var(--atpNavy2);color:#fff;border-radius:16px;overflow:hidden;cursor:pointer;'
  + 'box-shadow:0 16px 48px rgba(4,12,30,.55);border:1px solid var(--atpLine);'
  + 'font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;'
  + 'transition:transform .2s ease, box-shadow .2s ease}'
  + '#atpCard:hover{transform:translateY(-3px);box-shadow:0 22px 60px rgba(0,113,243,.35)}'
  + '#atpCard .mini{position:relative;height:150px;background:var(--atpNavy);overflow:hidden}'
  + '#atpCard .mini .play{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:3}'
  + '#atpCard .mini .play span{width:52px;height:52px;border-radius:50%;display:flex;align-items:center;'
  + 'justify-content:center;background:rgba(0,113,243,.92);box-shadow:0 0 0 0 rgba(0,113,243,.5);'
  + 'animation:atpPulse 2.2s ease-out infinite}'
  + '@keyframes atpPulse{0%{box-shadow:0 0 0 0 rgba(0,113,243,.45)}70%{box-shadow:0 0 0 18px rgba(0,113,243,0)}100%{box-shadow:0 0 0 0 rgba(0,113,243,0)}}'
  + '#atpCard .body{padding:14px 16px 16px}'
  + '#atpCard h3{margin:0 0 4px;font-size:15.5px;font-weight:800;line-height:1.3}'
  + '#atpCard p{margin:0;font-size:12.5px;line-height:1.5;color:#B9C9E6}'
  + '#atpCard .min{position:absolute;top:8px;right:10px;z-index:5;background:rgba(8,16,34,.6);border:none;'
  + 'color:#AFC4E4;font-size:15px;cursor:pointer;line-height:1;padding:4px 8px;border-radius:7px}'
  + '#atpPill{position:fixed;bottom:20px;right:20px;z-index:2147483000;display:none;align-items:center;gap:8px;'
  + 'background:linear-gradient(135deg,var(--atpB),var(--atpBD));color:#fff;border:none;cursor:pointer;'
  + 'border-radius:999px;padding:12px 18px;font-size:13px;font-weight:700;font-family:inherit;'
  + 'box-shadow:0 8px 26px rgba(0,113,243,.45)}'
  /* modal header — NEW PRODUCT ALERT */
  + '#atpModal .hero{padding:20px 24px 14px;text-align:center}'
  + '#atpModal .alert{display:inline-flex;align-items:center;gap:7px;font-size:10.5px;font-weight:800;'
  + 'letter-spacing:.16em;text-transform:uppercase;color:#FFD37E;background:rgba(245,158,11,.14);'
  + 'border:1px solid rgba(245,158,11,.45);border-radius:999px;padding:6px 14px;margin-bottom:10px}'
  + '#atpModal .alert::before{content:"";width:7px;height:7px;border-radius:50%;background:#F59E0B;'
  + 'animation:atpPulse 1.6s ease-out infinite}'
  + '#atpModal .hero h2{margin:0 0 6px;font-size:24px;font-weight:900;letter-spacing:-.01em;'
  + 'background:linear-gradient(90deg,#fff,#9CC5FF);-webkit-background-clip:text;background-clip:text;'
  + '-webkit-text-fill-color:transparent}'
  + '#atpModal .hero p{margin:0 auto;max-width:480px;font-size:13px;line-height:1.6;color:#C7D4EC}'
  /* modal */
  + '#atpModal{position:fixed;inset:0;z-index:2147483200;display:none;align-items:center;justify-content:center;'
  + 'background:rgba(4,10,24,.78);backdrop-filter:blur(6px);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}'
  + '#atpModal.open{display:flex}'
  + '#atpModal .frame{width:min(680px,94vw);background:var(--atpNavy2);border:1px solid var(--atpLine);'
  + 'border-radius:20px;overflow:hidden;box-shadow:0 30px 90px rgba(0,0,0,.6);color:#fff;position:relative}'
  + '#atpModal .x{position:absolute;top:12px;right:14px;z-index:9;background:rgba(8,16,34,.6);border:none;'
  + 'color:#AFC4E4;font-size:17px;cursor:pointer;padding:6px 10px;border-radius:8px}'
  + '#atpModal .chrome{display:flex;align-items:center;gap:6px;padding:11px 14px;background:#091226;'
  + 'border-bottom:1px solid var(--atpLine)}'
  + '#atpModal .chrome i{width:10px;height:10px;border-radius:50%;display:inline-block}'
  + '#atpModal .chrome .url{flex:1;text-align:center;font-size:11px;color:#7E93B8;'
  + 'font-family:"JetBrains Mono",Menlo,monospace;letter-spacing:.04em}'
  + '#atpStage{position:relative;height:300px;background:var(--atpNavy);overflow:hidden}'
  + '.atpScene{position:absolute;inset:0;padding:22px 26px;opacity:0;transform:translateY(10px);'
  + 'transition:opacity .45s ease,transform .45s ease;pointer-events:none}'
  + '.atpScene.on{opacity:1;transform:none}'
  + '.atpKicker{font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#7FB2FF;margin-bottom:10px}'
  + '.atpH{font-size:17px;font-weight:800;margin:0 0 14px}'
  + '.atpRow{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;padding:7px 10px;border-radius:8px;'
  + 'background:rgba(127,178,255,.07);border:1px solid rgba(127,178,255,.12);margin-bottom:6px;'
  + 'opacity:0;transform:translateX(-8px);transition:opacity .35s,transform .35s}'
  + '.atpRow.show{opacity:1;transform:none}'
  + '.atpRow b{font-family:"JetBrains Mono",Menlo,monospace;font-weight:600;color:#8FF0B4}'
  + '.atpTotal{display:flex;justify-content:space-between;font-size:14px;font-weight:800;padding:10px;margin-top:4px;'
  + 'border-top:1px dashed var(--atpLine);opacity:0;transition:opacity .4s}'
  + '.atpTotal.show{opacity:1}'
  + '.atpTotal b{color:#8FF0B4;font-family:"JetBrains Mono",Menlo,monospace}'
  + '.atpType{font-size:12.5px;line-height:1.75;color:#D7E3F8;white-space:pre-wrap;'
  + 'font-family:"JetBrains Mono",Menlo,monospace;min-height:120px}'
  + '.atpType::after{content:"▌";color:#7FB2FF;animation:atpBlink 1s steps(1) infinite}'
  + '@keyframes atpBlink{50%{opacity:0}}'
  + '.atpDoc{display:inline-flex;align-items:center;gap:7px;font-size:11.5px;font-weight:700;color:#fff;'
  + 'background:rgba(0,113,243,.18);border:1px solid rgba(0,113,243,.4);border-radius:8px;padding:7px 11px;'
  + 'margin:0 8px 8px 0;opacity:0;transform:scale(.9);transition:opacity .3s,transform .3s}'
  + '.atpDoc.show{opacity:1;transform:none}'
  + '.atpBarWrap{margin-bottom:12px;opacity:0;transition:opacity .35s}.atpBarWrap.show{opacity:1}'
  + '.atpBarLbl{display:flex;justify-content:space-between;font-size:11.5px;color:#B9C9E6;margin-bottom:5px}'
  + '.atpBar{height:9px;border-radius:9px;background:rgba(127,178,255,.12);overflow:hidden}'
  + '.atpBar i{display:block;height:100%;width:0;border-radius:9px;background:linear-gradient(90deg,#0071F3,#41A0FF);'
  + 'transition:width 1.1s cubic-bezier(.2,.7,.3,1)}'
  + '.atpBar i.warn{background:linear-gradient(90deg,#F59E0B,#EF4444)}'
  + '.atpAlert{margin-top:6px;font-size:12px;font-weight:700;color:#FCA5A5;opacity:0;transition:opacity .4s}'
  + '.atpAlert.show{opacity:1}'
  + '.atpDots{position:absolute;bottom:12px;left:0;right:0;display:flex;justify-content:center;gap:7px}'
  + '.atpDots i{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.25);cursor:pointer;transition:background .3s,transform .3s}'
  + '.atpDots i.on{background:#41A0FF;transform:scale(1.25)}'
  + '#atpModal .cta{display:flex;gap:10px;padding:16px 22px 20px;flex-wrap:wrap}'
  + '#atpModal .cta a{flex:1;min-width:200px;text-align:center;text-decoration:none;border-radius:10px;'
  + 'padding:13px 16px;font-size:14px;font-weight:800}'
  + '#atpModal .cta .p{background:linear-gradient(135deg,var(--atpB),var(--atpBD));color:#fff;'
  + 'box-shadow:0 6px 22px rgba(0,113,243,.4)}'
  + '#atpModal .cta .g{border:1px solid rgba(255,255,255,.28);color:#fff}'
  + '#atpModal .fine{text-align:center;font-size:10.5px;letter-spacing:.1em;color:#7E93B8;padding:0 0 16px;'
  + 'font-family:"JetBrains Mono",Menlo,monospace}'
  + '#atpMiniStage .atpKicker,#atpMiniStage .atpH{display:none}'
  + '#atpMiniStage .atpRow{font-size:11px;padding:6px 9px}'
  + '@media(max-width:480px){#atpCard{left:14px;right:14px;bottom:14px;width:auto}#atpStage{height:340px}}';

  var style = document.createElement('style');
  style.textContent = css; document.head.appendChild(style);

  /* ── the four demo scenes ───────────────────────────────────────────── */
  function sceneBoq(){return ''
    + '<div class="atpKicker">1 · Send your drawings</div>'
    + '<div class="atpH">The AI QS prices the job for you</div>'
    + '<div class="atpRow"><span>Excavate &amp; cart away, reduced level dig</span><b>£4,120</b></div>'
    + '<div class="atpRow"><span>C25 concrete foundations, poured &amp; tamped</span><b>£6,840</b></div>'
    + '<div class="atpRow"><span>Blockwork to DPC, 100mm solid</span><b>£3,265</b></div>'
    + '<div class="atpRow"><span>Steel beam, 203×133 UB25 incl. padstones</span><b>£1,910</b></div>'
    + '<div class="atpTotal"><span>Priced BOQ — back the same day</span><b>£47,380</b></div>';}
  function sceneDocs(){return ''
    + '<div class="atpKicker">2 · The paperwork writes itself</div>'
    + '<div class="atpH">Quotes, RAMS &amp; contracts in minutes</div>'
    + '<div class="atpType" id="atpTyped"></div>'
    + '<div style="margin-top:10px">'
    + '<span class="atpDoc">📄 Quote — on your letterhead</span>'
    + '<span class="atpDoc">🦺 RAMS — site-specific</span>'
    + '<span class="atpDoc">✍️ Contract — ready to sign</span></div>';}
  function sceneCost(){return ''
    + '<div class="atpKicker">3 · While the job runs</div>'
    + '<div class="atpH">It catches overspend before you feel it</div>'
    + '<div class="atpBarWrap"><div class="atpBarLbl"><span>Groundworks</span><span>82% of budget</span></div>'
    + '<div class="atpBar"><i data-w="82%"></i></div></div>'
    + '<div class="atpBarWrap"><div class="atpBarLbl"><span>Superstructure</span><span>64% of budget</span></div>'
    + '<div class="atpBar"><i data-w="64%"></i></div></div>'
    + '<div class="atpBarWrap"><div class="atpBarLbl"><span>Roofing — materials</span><span>108% of budget</span></div>'
    + '<div class="atpBar"><i class="warn" data-w="100%"></i></div>'
    + '<div class="atpAlert">⚠ £1,240 over — priced as a variation, sent for sign-off</div></div>';}
  function sceneJobs(){return ''
    + '<div class="atpKicker">4 · Every month, included</div>'
    + '<div class="atpH">AI QS jobs built into your plan</div>'
    + '<div class="atpRow"><span>Trade — 1 priced job / month</span><b>£149/mo</b></div>'
    + '<div class="atpRow"><span>Builder — 5 priced jobs / month</span><b>£399/mo</b></div>'
    + '<div class="atpRow"><span>Contractor — 10 priced jobs / month</span><b>£599/mo</b></div>'
    + '<div class="atpTotal"><span>Unused jobs roll over 60 days</span><b>2 months free annually</b></div>';}

  var SCENES = [sceneBoq, sceneDocs, sceneCost, sceneJobs];
  var TYPED = 'Client: Mr & Mrs Dawson\nJob: Single-storey rear extension\n\nDear Mr & Mrs Dawson,\nPlease find our quotation for the works at\n14 Orchard Lane, totalling £47,380 exc. VAT…';

  /* ── DOM ────────────────────────────────────────────────────────────── */
  var card = document.createElement('div');
  card.id = 'atpCard';
  card.innerHTML = '<button class="min" aria-label="Minimise">–</button>'
    + '<div class="mini"><div class="play"><span><svg width="18" height="18" viewBox="0 0 24 24" fill="#fff"><path d="M8 5v14l11-7z"/></svg></span></div>'
    + '<div id="atpMiniStage" style="position:absolute;inset:0;opacity:.5"></div></div>'
    + '<div class="body"><h3>🚨 New product — The AI Trades Pilot</h3>'
    + '<p>Prices the job, writes the paperwork, tracks the money, orders the materials. Watch the 60-second demo.</p></div>';

  var pill = document.createElement('button');
  pill.id = 'atpPill';
  pill.innerHTML = '<svg width="13" height="13" viewBox="0 0 24 24" fill="#fff"><path d="M8 5v14l11-7z"/></svg> Watch the demo';

  var modal = document.createElement('div');
  modal.id = 'atpModal';
  modal.innerHTML = '<div class="frame"><button class="x" aria-label="Close">✕</button>'
    + '<div class="hero"><span class="alert">New product alert</span>'
    + '<h2>The AI Trades Pilot</h2>'
    + '<p>From the team behind your BOQs: one platform that prices the job, writes your quotes, RAMS '
    + '&amp; contracts, tracks every pound while you build, and orders the materials. Watch it work —</p></div>'
    + '<div class="chrome"><i style="background:#FF5F57"></i><i style="background:#FEBC2E"></i><i style="background:#28C840"></i>'
    + '<span class="url">app.aitradespilot.com — live demo</span></div>'
    + '<div id="atpStage"></div>'
    + '<div class="cta"><a class="p" href="' + TRIAL_URL + '" target="_blank" rel="noopener">Start your 14-day free trial</a>'
    + '<a class="g" href="' + DEMO_URL + '" target="_blank" rel="noopener">Book a 30-min demo</a></div>'
    + '<div class="fine">14 DAYS FREE · 1 FREE AI QS JOB · CANCEL MONTHLY ANY TIME</div></div>';

  /* ── scene engine ───────────────────────────────────────────────────── */
  var stage, dots, current = 0, timers = [], auto;
  function clearTimers(){ timers.forEach(clearTimeout); timers = []; clearTimeout(auto); }
  function later(fn, ms){ timers.push(setTimeout(fn, ms)); }

  function playScene(i){
    clearTimers();
    current = i;
    stage.innerHTML = '<div class="atpScene">' + SCENES[i]() + '</div>'
      + '<div class="atpDots">' + SCENES.map(function(_,d){
          return '<i class="' + (d===i?'on':'') + '" data-d="' + d + '"></i>';
        }).join('') + '</div>';
    var scene = stage.querySelector('.atpScene');
    later(function(){ scene.classList.add('on'); }, 40);

    // staged reveals
    stage.querySelectorAll('.atpRow, .atpDoc, .atpBarWrap').forEach(function(el, n){
      later(function(){ el.classList.add('show'); }, 350 + n * 420);
    });
    stage.querySelectorAll('.atpBar i').forEach(function(bar, n){
      later(function(){ bar.style.width = bar.getAttribute('data-w'); }, 600 + n * 420);
    });
    var total = stage.querySelector('.atpTotal');
    if (total) later(function(){ total.classList.add('show'); }, 2300);
    var alert = stage.querySelector('.atpAlert');
    if (alert) later(function(){ alert.classList.add('show'); }, 2600);
    var typed = stage.querySelector('#atpTyped');
    if (typed) { var pos = 0; (function tick(){
      if (pos <= TYPED.length) { typed.textContent = TYPED.slice(0, pos); pos += 2; timers.push(setTimeout(tick, 34)); }
    })(); }

    stage.querySelectorAll('.atpDots i').forEach(function(dot){
      dot.addEventListener('click', function(e){ e.stopPropagation(); playScene(+dot.getAttribute('data-d')); });
    });
    auto = setTimeout(function(){ playScene((i + 1) % SCENES.length); }, 5200);
  }

  function openModal(){ modal.classList.add('open'); playScene(0); }
  function closeModal(){ modal.classList.remove('open'); clearTimers(); }

  /* ── mini preview: soft-looping bars behind the play button ─────────── */
  function miniLoop(el){
    el.innerHTML = '<div style="padding:16px 18px">' + sceneBoq() + '</div>';
    var n = 0;
    setInterval(function(){
      var rows = el.querySelectorAll('.atpRow, .atpTotal');
      rows.forEach(function(r, k){ r.classList.toggle('show', k <= (n % (rows.length + 2))); });
      n++;
    }, 700);
  }

  function mount(){
    document.body.appendChild(card);
    document.body.appendChild(pill);
    document.body.appendChild(modal);
    stage = modal.querySelector('#atpStage');
    miniLoop(card.querySelector('#atpMiniStage'));

    card.addEventListener('click', openModal);
    card.querySelector('.min').addEventListener('click', function(e){
      e.stopPropagation(); card.style.display = 'none'; pill.style.display = 'inline-flex';
    });
    pill.addEventListener('click', function(){
      pill.style.display = 'none'; card.style.display = 'block';
    });
    modal.querySelector('.x').addEventListener('click', closeModal);
    modal.addEventListener('click', function(e){ if (e.target === modal) closeModal(); });
    document.addEventListener('keydown', function(e){ if (e.key === 'Escape') closeModal(); });
  }
  function boot() {
    mount();
    // PROMINENT MODE: the full demo opens by itself on arrival, once per
    // browsing session — after closing it, only the corner card follows them
    // between pages. Every new visit starts with the demo again.
    // (To make it once per DAY instead, swap sessionStorage for localStorage
    // and use a date-stamped key.)
    var seen = false;
    try { seen = sessionStorage.getItem('atp_demo_autoplayed') === '1'; } catch (e) {}
    if (!seen) {
      try { sessionStorage.setItem('atp_demo_autoplayed', '1'); } catch (e) {}
      setTimeout(openModal, 700);
    }
  }
  if (document.body) boot(); else document.addEventListener('DOMContentLoaded', boot);
})();
</script>
</body>
</html>
