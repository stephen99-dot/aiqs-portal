name: Unit tests

# The unit suite exists (12 test files) but nothing ran it, so a merge could only be
# blocked by the eval harness — and that gates on a single synthetic fixture. This runs
# `npm test` on every push and pull request.
#
# Kept separate from evals.yml on purpose: a failure here means the code is broken, while
# a failure there means takeoff quality moved. Those want different reactions, so they
# should not share a red X.

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Node 22, not the 20 that evals.yml pins: `npm test` passes a glob
          # ("server/**/*.test.js") to `node --test`, and glob support in the test
          # runner landed in Node 22. On 20 the pattern matches nothing.
          node-version: '22'
          cache: 'npm'
      - name: Install dependencies
        # npm ci, not npm install — better-sqlite3 and sharp are native modules and
        # the lockfile is what makes the run reproducible.
        run: npm ci
      - name: Run unit tests
        run: npm test
