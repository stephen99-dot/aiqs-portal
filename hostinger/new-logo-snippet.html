<!--

  Use this to replace the old logo (the amber rounded "QS" square) anywhere
  it still appears on theaiqs.co.uk pages. In Hostinger File Manager, open
  the page, find the old logo markup in the header (an <img> tag or a small
  <div> containing "QS"), delete it, and paste ONE of the blocks below in

  Two variants — pick by the background the logo sits on:
    • LIGHT variant: for white/light page headers (dark navy "AI").
    • DARK variant: for dark navy headers/footers (near-white "AI").
  Both match the homepage logo exactly.
-->
